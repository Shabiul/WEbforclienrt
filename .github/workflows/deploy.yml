name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - claude/kind-bardeen-bguq32
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        run: |
          npm install -g vercel@latest

          # Fetch project ID for webforclientart69
          PROJECT_ID=$(curl -s "https://api.vercel.com/v9/projects/webforclientart69" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))")

          # Fetch user/org ID
          USER_ID=$(curl -s "https://api.vercel.com/v2/user" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('user',{}).get('id',''))")

          echo "Project ID: $PROJECT_ID"
          echo "Org ID: $USER_ID"

          mkdir -p .vercel
          echo "{\"projectId\":\"$PROJECT_ID\",\"orgId\":\"$USER_ID\"}" > .vercel/project.json

          vercel deploy --prod --token=$VERCEL_TOKEN --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
