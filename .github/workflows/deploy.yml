name: Deploy to Vercel

on:
  push:
    branches:
      - claude/kind-bardeen-bguq32
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        run: |
          npm install -g vercel@latest

          # Create project named 'impact-technology' (no-op if already exists)
          curl -s -X POST "https://api.vercel.com/v9/projects" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"impact-technology","framework":"nextjs"}' > /dev/null

          # Fetch project ID
          PROJECT_ID=$(curl -s "https://api.vercel.com/v9/projects/impact-technology" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))")

          # Fetch user/org ID
          USER_ID=$(curl -s "https://api.vercel.com/v2/user" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('user',{}).get('id',''))")

          echo "Project ID: $PROJECT_ID"
          echo "Org ID: $USER_ID"

          # Link to the correct project
          mkdir -p .vercel
          echo "{\"projectId\":\"$PROJECT_ID\",\"orgId\":\"$USER_ID\"}" > .vercel/project.json

          # Deploy to production
          vercel deploy --prod --token=$VERCEL_TOKEN --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
